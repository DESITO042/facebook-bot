<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: linear-gradient(145deg, #f3f6fc, #edf8f6);
      font-family: Arial, sans-serif;
    }

    .login-btn {
      width: min(100%, 420px);
      min-height: 64px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 1px solid rgba(255, 255, 255, .3);
      border-radius: 16px;
      background: linear-gradient(115deg, #0866ff 0%, #1877f2 55%, #3588ff 100%);
      box-shadow: 0 10px 24px rgba(24, 119, 242, .28), inset 0 1px 0 rgba(255, 255, 255, .28);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(24, 119, 242, .36), inset 0 1px 0 rgba(255, 255, 255, .3);
      filter: saturate(1.08);
    }

    .login-btn:active {
      transform: translateY(0)
    }

    .login-btn:focus-visible {
      outline: 3px solid #00a884;
      outline-offset: 4px
    }

    .fb-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex: 0 0 38px;
      border: 1px solid rgba(24, 119, 242, .12);
      border-radius: 50%;
      background: linear-gradient(145deg, #fff, #edf4ff);
      box-shadow: 0 3px 8px rgba(0, 39, 99, .2), inset 0 1px 2px #fff;
    }

    .fb-icon svg {
      display: block;
      width: 25px;
      height: 25px;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .12))
    }

    .login-label {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center
    }

    .connect-label {
      padding: 5px 9px;
      border: 1px solid rgba(255, 255, 255, .3);
      border-radius: 999px;
      background: rgba(255, 255, 255, .14);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .01em;
    }

    @media(max-width:360px) {
      .login-btn {
        gap: 9px;
        padding: 11px 14px;
        font-size: 15px
      }

      .fb-icon {
        width: 34px;
        height: 34px;
        flex-basis: 34px
      }
    }

    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #574f4f;
      /* dark red */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 9999;
    }

    .loader-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 6px solid rgba(255, 255, 255, 0.2);
      border-top: 6px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 1s linear infinite;
      transition: border-top-color 0.5s, opacity 0.5s;
      background: rgba(0, 0, 0, 0.2);
    }

    #loaderPercent {
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg)
      }

      100% {
        transform: rotate(360deg)
      }
    }

    .loader-text {
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      font-family: Arial;
    }

    .loader-bar-bg {
      width: 220px;
      height: 10px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      overflow: hidden;
    }

    .loader-bar {
      height: 100%;
      width: 0%;
      background: #fff;
      border-radius: 10px;
      transition: width 0.3s;
    }

    .loader-sub {
      color: #ddd;
      font-size: 14px;
      font-family: Arial;
    }
  </style>
</head>

<body>
  <!-- LOADER START -->
  <div id="loader">
    <div class="loader-circle" id="loaderCircle">
      <span id="loaderPercent">0%</span>
    </div>
    <div class="loader-text">Loading SwiftReply...</div>
    <div class="loader-bar-bg">
      <div class="loader-bar" id="loaderBar"></div>
    </div>
    <div class="loader-sub" id="loaderSub">Connecting...</div>
  </div>

  <!-- YOUR NORMAL PAGE CONTENT, HIDE AM FIRST -->
  <div id="mainContent" style="display:none;">
    <button class="login-btn" aria-label="Login with Facebook and connect a Page"
      onclick="window.location.href='/auth/facebook?next=/dashboard.html'">
      <span class="fb-icon">
        <svg viewBox="0 0 24 24" fill="#1877f2" aria-hidden="true">
          <path
            d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
        </svg>
      </span>
      <span class="login-label">Login with Facebook <span class="connect-label">+ Connect Page</span></span>
    </button>
  </div>
  <!-- LOADER END -->
  <script>
    const colors = ["#ffffff", "#FFD700", "#00D4FF", "#00FF88", "#FF6B6B", "#FF9F43", "#B983FF"];
    let colorIndex = 0;
    let progress = 0;
    const circle = document.getElementById("loaderCircle");
    const bar = document.getElementById("loaderBar");
    const percentText = document.getElementById("loaderPercent");
    const sub = document.getElementById("loaderSub");
    const texts = ["Connecting...", "Loading Dashboard...", "Loading Pages...", "Almost ready...", "Opening SwiftReply..."];

    // Change colour + opacity every 3 seconds
    const colorTimer = setInterval(() => {
      colorIndex = (colorIndex + 1) % colors.length;
      circle.style.borderTopColor = colors[colorIndex];
      circle.style.opacity = colorIndex % 2 === 0 ? "1" : "0.65"; // opacity dey change
      bar.style.background = colors[colorIndex];
    }, 3000);

    // Progress 0 to 100 in 20 seconds
    const progressTimer = setInterval(() => {
      progress += 1; // 100 / 20 sec = 5% per sec, we run every 200ms so 1% per 200ms
      if (progress > 100) progress = 100;
      bar.style.width = progress + "%";
      percentText.textContent = progress + "%";
      sub.textContent = texts[Math.floor(progress / 25)] || "Almost ready...";
    }, 200);

    // After 20 seconds, hide loader, show page
    setTimeout(() => {
      clearInterval(colorTimer);
      clearInterval(progressTimer);
      document.getElementById("loader").style.display = "none";
      document.getElementById("mainContent").style.display = "block";
    }, 20000);
  </script>
</body>

</html>
